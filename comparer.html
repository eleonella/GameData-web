<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <title>GameData - Comparer</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <div class="logo">
            <img src="images/logo_Game_Data-1.jpeg" alt="">
            <h1>GameData</h1>
        </div>

        <nav>
            <a href="index.html">Accueil</a>
            <a href="explorer.html">Explorer</a>
            <a href="comparer.html" class="actif">Comparer</a>
            <a href="sources.html">Sources</a>
        </nav>
    </header>

    <main class="page-comparer">
        <h2>Comparer les consoles</h2>
        <p>Comparez les ventes de jeux vidéo entre deux consoles.</p>

        <form>
            <label for="console-a">Console A</label>
            <select id="console-a" name="console_a">
                <option value="">Choisir une console</option>
            </select>

            <label for="console-b">Console B</label>
            <select id="console-b" name="console_b">
                <option value="">Choisir une console</option>
            </select>

            <button type="submit">Appliquer</button>
        </form>

        <div class="resultat">
            <h3>Ventes par année de sortie</h3>
            <p>Le graphique apparaîtra ici.</p>
        </div>

        <div class="resultat">
            <h3>Répartition des ventes par région</h3>
            <p>Les résultats apparaîtront ici.</p>
        </div>
    </main>

</body>
</html>
